#============================================
# Hyprland Keybindings
# ==========================================

# ==========================================
# Aplicaciones
# ==========================================

# Terminal - Ghostty
bind = $mainMod, RETURN, exec, ghostty

# Explorador de archivos - Thunar
bind = $mainMod, E, exec, thunar

# Lanzador de aplicaciones - Wofi
bind = $mainMod, D, exec, wofi --show drun


# ==========================================
# Ventanas
# ==========================================

# Cerrar ventana activa
bind = $mainMod, Q, killactive

# Cambiar ventana enfocada
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mover ventana
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d


# ==========================================
# Workspaces
# ==========================================

# Cambiar de workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Mover ventana al workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# ==========================================
# Configuración de Hyprland
# ==========================================

# Recargar configuración
bind = $mainMod, R, exec, hyprctl reload

# Controles de sesion
bind = $mainMod, M, exec, wlogout

# ==========================================
# Capturas de pantalla
# ==========================================
# Captura de pantalla completa
bind = $mainMod, PRINT, exec, grim "/home/chivo/Imágenes/Capturas de pantalla/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"

# Captura de área
bind = $mainMod SHIFT, PRINT, exec, grim -g "$(slurp)" "/home/chivo/Imágenes/Capturas de pantalla/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"
# ==========================================
# Volumen
# ==========================================

# Subir volumen
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# Bajar volumen
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Silenciar / activar volumen
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# ==========================================
# Brillo
# ==========================================

# Aumentar brillo
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# Disminuir brillo
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , F12, exec, ghostty

# ========================================
# Cambiar Fondos de Pantalla
#========================================
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper_menu.sh

# ========================================
# Modificacion de Ventanas
# =======================================

# Mover ventanas flotantes
bindm = SUPER, mouse:272, movewindow

# Redimensionar ventanas flotantes
bindm = SUPER, mouse:273, resizewindow

# Convertir ventana actual en flotante
bind = SUPER, V, togglefloating

# Centrar ventana flotante
bind = SUPER, C, centerwindow


